name: CI/CD - Build, Push to ECR, Update GitOps Manifest

# Pipeline: test -> build -> smoke test -> push to ECR (OIDC) -> bump image tag in k8s/
# Argo CD then pulls the manifest change and deploys it to EKS. This workflow never
# talks to the cluster, so GitHub holds no Kubernetes credentials at all.

on:
  push:
    branches: [main]
    # Manifest-only / docs-only commits do not rebuild the image.
    # (Argo CD still deploys k8s/ changes - that is the GitOps path.)
    paths-ignore:
      - "k8s/**"
      - "argocd/**"
      - "infra/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false   # never cancel a run half-way through a deploy

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  IMAGE_NAME: student-portal

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests (pytest)
        run: pytest --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results.xml

  build-and-push:
    name: Build, smoke test and push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required to request the GitHub OIDC token for AWS
    outputs:
      image: ${{ steps.push.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Compute image tag
        id: meta
        run: |
          TAG="${GITHUB_SHA::7}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (load locally for testing)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker run -d --name smoke -p 127.0.0.1:8080:8080 "$IMAGE"
          trap 'docker rm -f smoke >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz | tee /tmp/health.json
          grep -q "\"version\":\"${TAG}\"" /tmp/health.json
          curl -fsS http://127.0.0.1:8080/ | grep -q "Welcome to the Student Portal"
          curl -fsS http://127.0.0.1:8080/api/students | grep -q "roll_number"
          echo "Smoke test passed for ${IMAGE}"
          docker logs smoke | tail -n 20

      # ---- Everything below runs only for pushes to main (never for PRs) ----
      # Preferred: OIDC (short-lived credentials, nothing stored). Used when the
      # repository variable AWS_ROLE_ARN is set.
      - name: Configure AWS credentials (OIDC, no stored keys)
        if: github.event_name != 'pull_request' && vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # Fallback: AWS Free plan accounts block IAM OIDC providers through a
      # service control policy, so OIDC cannot be set up there. Use a dedicated
      # IAM user that can ONLY push to this one ECR repository
      # (infra/02b-github-ecr-user.sh). Keys live in encrypted GitHub secrets.
      - name: Configure AWS credentials (scoped IAM user fallback)
        if: github.event_name != 'pull_request' && vars.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name != 'pull_request'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push the tested image to Amazon ECR
        if: github.event_name != 'pull_request'
        id: push
        env:
          LOCAL: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          REMOTE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # Push the exact image that passed the smoke test (no rebuild).
          docker tag "$LOCAL" "$REMOTE:$TAG"
          docker push "$REMOTE:$TAG"
          echo "image=${REMOTE}" >> "$GITHUB_OUTPUT"
          echo "### Pushed \`${REMOTE}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for ECR vulnerability scan (report only)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          aws ecr wait image-scan-complete --repository-name "$ECR_REPOSITORY" --image-id imageTag="$TAG" || true
          aws ecr describe-image-scan-findings --repository-name "$ECR_REPOSITORY" --image-id imageTag="$TAG" \
            --query 'imageScanFindings.findingSeverityCounts' --output table || true

  update-manifest:
    name: Update GitOps manifest (k8s/kustomization.yaml)
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit the new image tag back to the repo
    steps:
      - name: Check out source code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set new image in kustomization.yaml
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          test -n "$IMAGE" && test -n "$TAG"
          yq -i '(.images[] | select(.name == "student-portal")) |= (.newName = strenv(IMAGE) | .newTag = strenv(TAG))' \
            k8s/kustomization.yaml
          git diff -- k8s/kustomization.yaml

      - name: Commit and push
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          if git diff --quiet -- k8s/kustomization.yaml; then
            echo "Manifest already at ${TAG}; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "deploy: student-portal ${TAG}" -m "Source commit: ${GITHUB_SHA}"
          # Retry in case another commit landed on main meanwhile.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "Failed to push manifest update" && exit 1
          # Note: pushes made with GITHUB_TOKEN never trigger another workflow run,
          # and paths-ignore covers k8s/** anyway, so there is no CI loop.
