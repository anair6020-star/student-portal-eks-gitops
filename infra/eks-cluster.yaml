# eksctl cluster definition (rendered by 03-create-eks-cluster.sh via envsubst).
# 3 x t3.small worker nodes (free-tier eligible types) in private subnets, one NAT gateway (cost-conscious lab setup).
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ${CLUSTER_NAME}
  region: ${AWS_REGION}
  version: "${K8S_VERSION}"
  tags:
    project: student-portal
    purpose: cicd-assignment

iam:
  withOIDC: false  # true needs an IAM OIDC provider (blocked on AWS Free plan accounts); not needed by this app

accessConfig:
  authenticationMode: API_AND_CONFIG_MAP
  bootstrapClusterCreatorAdminPermissions: true   # the EC2 role that creates the cluster gets admin

vpc:
  nat:
    gateway: Single
  clusterEndpoints:
    publicAccess: true
    privateAccess: true

managedNodeGroups:
  - name: ng-general
    amiFamily: AmazonLinux2023
    instanceType: t3.small
    minSize: 3
    desiredCapacity: 3
    maxSize: 3
    volumeSize: 20
    volumeType: gp3
    privateNetworking: true
    labels:
      role: general
    tags:
      project: student-portal
