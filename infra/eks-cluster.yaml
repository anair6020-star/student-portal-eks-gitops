# eksctl cluster definition (rendered by 03-create-eks-cluster.sh via envsubst).
# 2 x t3.medium worker nodes in private subnets, one NAT gateway (cost-conscious lab setup).
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ${CLUSTER_NAME}
  region: ${AWS_REGION}
  version: "${K8S_VERSION}"
  tags:
    project: student-portal
    purpose: cicd-assignment

iam:
  withOIDC: true   # enables IAM Roles for Service Accounts for future add-ons

accessConfig:
  authenticationMode: API_AND_CONFIG_MAP
  bootstrapClusterCreatorAdminPermissions: true   # the EC2 role that creates the cluster gets admin

vpc:
  nat:
    gateway: Single
  clusterEndpoints:
    publicAccess: true
    privateAccess: true

managedNodeGroups:
  - name: ng-general
    amiFamily: AmazonLinux2023
    instanceType: t3.medium
    minSize: 2
    desiredCapacity: 2
    maxSize: 3
    volumeSize: 20
    volumeType: gp3
    privateNetworking: true
    labels:
      role: general
    tags:
      project: student-portal
